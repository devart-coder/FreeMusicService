<!DOCTYPE html>
<html lang="ru">
<head>
	 <title>MusicPlayLists</title> 
 	 <link th:href="@{css/playlists.css}" rel="stylesheet">
 </head>
<body>
	<img th:if="${background}" th:src="@{'images/backgrounds/' + ${background} }" alt ="Background not set">
	<div th:insert="~{ shared_page :: header}"></div>
	<main>
		<section>
			<div class="createNewPlayListLabels">
				<form method="post">
				<span>New Playlist:</span>
					<input type="hidden" name="_csrf" th:value="${_csrf.token}">
					<input type="text" name="createButton" placeholder="Name">
					<button class="createButton" type="submit">
						Create
					</button>
					<span id="createPlayListNameError" th:text="${create_error}"></span>
				</form>
			</div>
		</section>

		<section>
			<table>
				<thead>
					<tr>
						<th>Act</th>
						<th>Name</th>
						<th>Songs</th>
						<th>CreationTime</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="pl:${playlists}"  >
						<td >
						<form method="post">
							<input  type = "hidden" name = "_csrf" th:value="${_csrf.token}">
							<button class = "deleteButton" type = "submit" name = "deleteButton" th:value="${pl.id}">Delete</button>
						</form>
						</td>
						<td th:text="${pl.name}" ></td>
						<td th:text="${pl.size}"></td>
						<td th:text="${pl.createdBy}"></td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>
	<footer>
		<div class="footFields">
			<span id="userLabel">User:</span>
			<span id = "userField" th:text="${user}"></a>
		</div>
		
		<div class="footFields">
			<span id="userLabel">Playlist:</span>
			<span id="userField" th:text="${main_playlist.name}"></span>
		</div>
		
		<form method="post" >	
			<input type="hidden" name="_csrf" th:value="${_csrf.token}">
			<select th:name="mainButton">
				<option 
					th:each="pl:${playlists}"
					th:text="${pl.name}"
					th:value="${pl.id}"
				></option>
			</select>
			<label for="mainButton"> set as </label>
			<button type="submit">Main</button>
		</form>
	</footer>
</body>
</html>
