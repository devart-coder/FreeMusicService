spring.application.name=FreeMusicService
#DataBaseProperties
spring.datasource.url=jdbc:mysql://localhost
spring.datasource.username = codeman
spring.datasource.password = codeman.MySQL.getPassword();
spring.sql.init.mode=always
#OAuth2ClientProperties
#FMS-Authentication:
#FMS-Provider
spring.security.oauth2.client.provider.fms_provider.issuer-uri=http://127.0.0.1:9090
#spring.security.oauth2.client.provider.fms_provider.authorization-uri=http://127.0.0.1:9090/oauth2/authorize
#spring.security.oauth2.client.provider.fms_provider.jwk-set-uri=http://127.0.0.1:9090/oauth2/jwks
#spring.security.oauth2.client.provider.fms_provider.token-uri=http://127.0.0.1:9090/oauth2/token
#FMS-Authentication
spring.security.oauth2.client.registration.FMS.client-id=client
spring.security.oauth2.client.registration.FMS.client-secret=secret
spring.security.oauth2.client.registration.FMS.client-name=Authentication
spring.security.oauth2.client.registration.FMS.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.FMS.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.FMS.provider=fms_provider
spring.security.oauth2.client.registration.FMS.redirect-uri=http://localhost:8080/login/oauth2/code/FMS
spring.security.oauth2.client.registration.FMS.scope=openid
